# LocalLife OS — local development database
# Usage: docker compose up -d
# Connect: postgresql://locallife:locallife@localhost:5432/locallife
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: locallife-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: locallife
      POSTGRES_PASSWORD: locallife
      POSTGRES_DB: locallife
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U locallife -d locallife']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
